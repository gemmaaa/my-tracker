<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Quick Log</title>
  <style>
    :root { --bg: #f2f2f7; --card: #ffffff; --accent: #007aff; --text: #1c1c1e; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; -webkit-tap-highlight-color: transparent; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 16px; }
    input, button { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #e5e5ea; box-sizing: border-box; margin-bottom: 8px; }
    button { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }
    .btn-export { background: #34c759; margin-top: 8px; }
    .log-item { border-bottom: 1px solid #e5e5ea; padding: 12px 0; }
    .log-item:last-child { border-bottom: none; }
    .time { font-size: 12px; color: #8e8e93; }
    .tag { background: #e5e5ea; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 500; margin-right: 4px; }
  </style>
</head>
<body>

  <h2>Quick Tracker</h2>
  <div class="card">
    <input type="text" id="tags" placeholder="Tags e.g. #food #lunch">
    <input type="text" id="note" placeholder="Log entry details...">
    <button onclick="addLog()">Save Entry</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Logs</h3>
    <div id="logsContainer"></div>
    <button class="btn-export" onclick="exportCSV()">Export to CSV</button>
  </div>

  <script>
    function getLogs() { return JSON.parse(localStorage.getItem('my_pwa_logs') || '[]'); }

    function addLog() {
      const tagsInput = document.getElementById('tags').value.trim();
      const noteInput = document.getElementById('note').value.trim();
      if (!noteInput) return;

      const newEntry = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        tags: tagsInput ? tagsInput.split(' ') : [],
        note: noteInput
      };

      const logs = getLogs();
      logs.unshift(newEntry);
      localStorage.setItem('my_pwa_logs', JSON.stringify(logs));

      document.getElementById('tags').value = '';
      document.getElementById('note').value = '';
      render();
    }

    function render() {
      const logs = getLogs();
      const container = document.getElementById('logsContainer');
      if (logs.length === 0) {
        container.innerHTML = '<p style="color:#8e8e93;">No logs yet.</p>';
        return;
      }
      container.innerHTML = logs.map(l => `
        <div class="log-item">
          <div class="time">${new Date(l.timestamp).toLocaleString()}</div>
          <div style="margin: 4px 0;"><strong>${l.note}</strong></div>
          <div>${l.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      `).join('');
    }

    function exportCSV() {
      const logs = getLogs();
      if (logs.length === 0) return alert('No data to export.');
      let csv = "Timestamp,Tags,Note\n";
      logs.forEach(l => {
        csv += `"${l.timestamp}","${l.tags.join(' ')}","${l.note.replace(/"/g, '""')}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracker_export_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    render();
  </script>
</body>
</html>
